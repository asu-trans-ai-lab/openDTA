# ST02d_twin_peaks: analytical point-queue case (generated by
# tools/generate_analytical_cases.py - do not hand-edit).
# lambda(t) as 31 piecewise-constant demand periods, mu = 1200/h constant,
# expected truth in expected/ from the exact fluid oracle.
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: true
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
