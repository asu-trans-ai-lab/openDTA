---
# ST00c: terminal-link actual-departure micro gate (defects S0c/S0d), gold
# REGENERATED at S2b with documented justification: the original 3-vehicle
# gold (TT 1.0/1.1/1.2) relied on minute batching to co-locate arrivals in
# interval 0; under S2b interval staggering they spread to 0/3/6 with no
# queue, and the case would stop testing FIFO ordering.
# Redesign: 30 vehicles over the 1-minute period, capacity 600/h = exactly
# 1 veh per 6-s interval. S2b staggering: arrivals 3 per interval
# (TA_i = i/3 for i = 0..29); service 1/interval from interval 10:
#   TD_i = 10 + i   ->   TT_i = (10 + i - i/3) intervals = (10+i-i/3)/10 min
# (i integer division). TT_0 = 1.0 min ... TT_29 = 3.0 min; total delay
# = sum(TT_i) - 30 = 29.0 intervals... asserted per agent from
# trajectories.csv by tools/check_agent_timestamps.py. Also asserts the
# staggering itself (arrival pattern 3/interval).
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: true
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: P1
    period_id: 1
    time_period: 0700-0701
    demand:
      - file_name: demand.csv
        agent_type: auto
  - period: DRAIN
    period_id: 2
    time_period: 0701-0710
    demand:
      - file_name: demand_zero.csv
        agent_type: auto
