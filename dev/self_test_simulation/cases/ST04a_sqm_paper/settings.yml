---
# ST04a_sqm_paper: analytical point-queue case (generated by
# tools/generate_analytical_cases.py - do not hand-edit).
# lambda(t) as 4 piecewise-constant demand periods, mu = 1200/h constant,
# expected truth in expected/ from the exact fluid oracle.
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: true
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: P01
    period_id: 1
    time_period: 0700-0710
    demand:
      - file_name: demand_p01.csv
        agent_type: auto
  - period: P02
    period_id: 2
    time_period: 0710-0718
    demand:
      - file_name: demand_p02.csv
        agent_type: auto
  - period: P03
    period_id: 3
    time_period: 0718-0726
    demand:
      - file_name: demand_p03.csv
        agent_type: auto
  - period: P04
    period_id: 4
    time_period: 0726-0826
    demand:
      - file_name: demand_p04.csv
        agent_type: auto
