---
# ST01: conditional profile -> departure-bin demand (S1 gate).
# D = 1000, AM_PEAK bins 0.4/0.6 -> departure_bin_demand.csv rows exactly
# 400 / 600. No vehicles are asserted here (that is S2); UE only.
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: false
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: AM
    period_id: 1
    time_period: 0700-0800
    demand:
      - file_name: demand.csv
        agent_type: auto

departure_profile_binding:
  - period_id: 1
    agent_type: auto
    profile_id: AM_PEAK
