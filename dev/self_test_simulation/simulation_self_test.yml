---
# OpenDTA Simulation Self-Test contract (the release contract for the DNL).
# Expected truth lives HERE and in expected/, never in production settings.yml.
# Harness: self_test_simulation.cpp (thin driver over production classes —
# it re-implements no physics; v1 mirrors these assertions in code, YAML
# parsing of this file is a planned harness upgrade).
suite:
  name: OpenDTA Simulation Self Test
  version: 1
  simulation_resolution_sec: 6

execution:
  default_threads: 1
  repeat_runs: 3
  fail_fast: true

tolerance:
  conservation_vehicle: 0
  cumulative_vehicle: 1
  event_time_intervals: 1
  analytical_relative: 0.001
  regional_relative: 0.01

cases:
  - id: ST00_F6_FREEFLOW
    path: cases/ST00_freeflow_tt
    enabled: true
    purpose: F5_F6_travel_time_speed_and_horizon_boundary
    # 1-mile link, 60 mph, integer service capacity, demand far below capacity:
    # every output row must show free-flow travel time and speed, and repeated
    # runs must be byte-identical. On the pre-S0 engine this case is RED:
    # get_travel_time(i,k) passes the simulation interval i into the
    # period-indexed vdfps lookup (out-of-bounds read).
    assertions:
      repeat_byte_identical:
        - link_performance_dta.csv
        - trajectories.csv
      expected:
        freeflow_travel_time_min: 1.0
        freeflow_speed_mph: 60.0

  - id: ST01_PROFILE_LOADING
    path: cases/ST01_profile_loading
    enabled: false          # awaits S1/S2 (agents do not consume profiles yet)
    expected:
      total_demand: 1000
      bin_counts: [400, 600]
      final_CA: 1000

  - id: ST02_POINT_QUEUE_GOLD
    path: cases/ST02a_step_gold        # generated bank: see tools/ + TEST_CATALOG.md
    enabled: partial                   # A/D/Q gates run today; TT/speed await S0c+S2
    # lambda = 600/1800/600 veh/h over 0-30/30-90/90-150 min, mu = 1200 veh/h.
    # Oracle: Q(t) = A_service(t) - D(t), A_service(t) = A_entry(t - fftt)
    # (LinkQueue::get_virtual_arrival). Raw-A_entry comparison would
    # clock-shift the events by the FFTT.
    #
    # Oracle exactness (qualified): the oracle is exact for the INTENDED
    # piecewise-constant demand-rate contract. The pre-S2 engine realizes a
    # period's volume in integer-minute batches (setup_agents quantizes the
    # departure offset to whole minutes), so transient CD/Q deficits of order
    # one minute-batch (~18 veh at 1800/h) are expected until S2 implements
    # 6-sec deterministic staggering. First suspect for those deltas is S2
    # loading realization - NOT the queue engine.
    #
    # THREE EVENT CLOCKS - never collapse these into one number again:
    events:
      entry_rate_breakpoint:           # demand definition clock
        onset_min: 30
        peak_end_min: 90
        recovery_end_min: 150
      service_point:                   # continuous congestion onset at the exit
        fftt_min: 1
        congestion_onset_continuous_min: 31
      sampled_queue:                   # what the minute-grid oracle/engine report
        first_positive_min: 32
        peak_min: 91
        clearance_min: 151
    expected:
      total_demand: 2700
      Qmax_veh: 600
      total_delay_veh_hour: 600
      max_wait_min: 30

  - id: ST04a_SQM_PAPER
    path: cases/ST04a_sqm_paper
    enabled: partial                   # A/D/Q today; SQM layer awaits S5a-S5d
    # Paper-exact SQM case (TT = FFTT + tw = tF + tQ; Eq. (8)-(10)):
    # lambda = 600/1500/900 veh/h over 10/8/8 min, mu = 1200, L = 1 mi,
    # vF = 60 mph; triangular FD w = 12 mph, kj = 180/mi/ln -> vQ = 15 mph.
    expected:
      total_demand: 420
      Qmax_veh: 40
      tw_max_min: 2.0
      TT_max_min: 3.0
      v_bar_min_mph: 20.0
      sqm:
        tQ_max_min: 2.6667             # tw * vF/(vF-vQ)
        tF_max_min: 0.3333             # FFTT - tw * vQ/(vF-vQ)
        dQ_max_mile: 0.6667            # vQ * tQ
    # SQM applicability requires tF > 0; ST02a (tw = 30 min on a 1-mi link)
    # deliberately violates it and stays a point-queue-only gold.

  # Registered diagnostic (defect S0c, terminal-link waiting time):
  # update_waiting_time() runs only on the transfer-to-next-link branch
  # (simulation.cpp), so terminal links record zero waiting -> TT == FFTT and
  # speed == FFS even with hundreds of vehicles queued. Validator rule:
  #   queue > 100 veh AND reported speed == free-flow  ->  FAIL (diagnostic).
  # Fix lands as its own gated mini-spec, never silently.

  - id: ST03_TANDEM
    path: cases/ST03_tandem_gold
    enabled: false          # awaits S6
    expected:
      conservation_exact: true
      cd1_ca2_tolerance_vehicle: 1

# Service-discretizer exact-sequence contract (S4, unit level):
#   legacy LCG: seed0 = 101, seed_{t+1} = (17364 * seed_t) % 65521,
#   release(+1) iff seed/65521 < frac. For c = 0.1 the first 20 realizations
#   with seed 101 are FROZEN once S4 lands; any change to the algorithm,
#   seed, comparison direction, draw count, or call ordering turns this red.

# Parallel era (P01-P03): extend with
#   thread_invariance: { thread_counts: [1, 2, 4, 8] }
# CA/CD/Q/N/trajectories must match the serial gold exactly.
