---
# F02 negative fixture: malformed time_period must terminate with a named error
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: false
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: AM
    time_period: 07x0-0800
    demand:
      - file_name: demand.csv
        agent_type: auto
