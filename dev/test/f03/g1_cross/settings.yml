---
# F03c cross-check fixture: the gold G1 case's departure_profile.csv is used
# as a 24h library (its period_id column is ignored with a notice); bindings
# pair P1_STEP/P2_STEP with the matching period windows.
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: false
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: AM1
    period_id: 1
    time_period: 0700-0800
    demand:
      - file_name: demand.csv
        agent_type: auto
  - period: AM2
    period_id: 2
    time_period: 0800-0900
    demand:
      - file_name: demand.csv
        agent_type: auto

departure_profile_binding:
  - period_id: 1
    agent_type: auto
    profile_id: P1_STEP
  - period_id: 2
    agent_type: auto
    profile_id: P2_STEP
