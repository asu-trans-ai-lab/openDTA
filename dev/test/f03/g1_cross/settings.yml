---
# F03 cross-check fixture: the gold G1 case's departure_profile.csv (P1/P2
# period_id form) must parse and pass G5 against the same period windows
# (P1 07:00-08:00, P2 08:00-09:00).
user_equilibrium:
  load_columns: false
  column_gen_num: 20
  column_opd_num: 20

simulation:
  enable: false
  resolution: 6
  traffic_flow_model: point_queue

agent_type:
  - type: a
    name: auto
    flow_type: 0
    pce: 1
    vot: 10
    free_speed: 60
    use_link_ffs: true

demand_period:
  - period: AM1
    period_id: 1
    time_period: 0700-0800
    departure_profile: P1_STEP
    demand:
      - file_name: demand.csv
        agent_type: auto
  - period: AM2
    period_id: 2
    time_period: 0800-0900
    departure_profile: P2_STEP
    demand:
      - file_name: demand.csv
        agent_type: auto
